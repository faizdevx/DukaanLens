{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto">
  <div class="card-body p-4">
    <h1 class="h3 mb-1"><i class="bi bi-shop"></i> Create your account</h1>
    <p class="text-muted">Free. Your data stays in your own database.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" id="username" name="username" value="{{ username or '' }}" required minlength="3" maxlength="30">
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" value="{{ email or '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password <small class="text-muted">(at least 8 characters)</small></label>
        <input class="form-control" type="password" id="password" name="password" required minlength="8">
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm">Confirm password</label>
        <input class="form-control" type="password" id="confirm" name="confirm" required minlength="8">
      </div>
      <button class="btn btn-primary w-100">Register</button>
    </form>
    <p class="mt-3 mb-0 text-center">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
