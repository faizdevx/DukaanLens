{% extends "base.html" %}
{% block title %}Edit budget{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Edit budget</h1>
<div class="card" style="max-width: 520px;">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label class="form-label" for="category">Category</label>
        <input class="form-control" id="category" name="category" maxlength="60" value="{{ form.get('category', '') }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="month">Month</label>
        <input class="form-control" type="month" id="month" name="month" value="{{ form.get('month', '') }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="limit_amount">Limit (₹)</label>
        <input class="form-control" type="number" step="0.01" min="0" id="limit_amount" name="limit_amount" value="{{ form.get('limit_amount', '') }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="notes">Notes</label>
        <input class="form-control" id="notes" name="notes" maxlength="500" value="{{ form.get('notes', '') }}">
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary">Save</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('budgets.list_budgets', month=budget.month) }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
